replicaCount: 2

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3000"
  - name: NATS_SERVERS
    value: "nats://nats.nats.svc.cluster.local:4222"
  - name: DATABASE_URL
    value: "file:./dev.db"

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi